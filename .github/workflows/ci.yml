name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

      # The browser artifact is a lazy-CJS factory DSH's client module system
      # loads by package name. Two invariants have no compile-time guard and
      # both fail silently at runtime, so they are asserted here:
      #   - the loader id must equal package.json's name, or the factory
      #     registers under a name nothing requests and the plugin never loads;
      #   - the CJS prologue must be present, or the bundle throws
      #     "exports is not defined" the moment the loader executes it.
      - name: Verify client bundle contract
        run: |
          package_name="$(node -p "require('./package.json').name")"
          head -c 4096 lib/client.js | grep -qF "id: \"${package_name}\"" || {
            echo "lib/client.js does not register under \"${package_name}\"."
            exit 1
          }
          head -c 4096 lib/client.js | grep -qF 'var module = { exports: {} };' || {
            echo 'lib/client.js is missing the CJS prologue (tsdown outputOptions.intro).'
            exit 1
          }
          echo "Client bundle registers as ${package_name} with its CJS prologue."

      - name: Verify package contents
        run: npm pack --dry-run
