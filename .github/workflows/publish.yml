name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${TAG_VERSION#v}"
          test "$tag_version" = "$package_version" || {
            echo "Tag $TAG_VERSION does not match package version $package_version."
            exit 1
          }

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

      # Same runtime-only invariants CI asserts; a broken bundle must not reach
      # the registry just because it was tagged.
      - name: Verify client bundle contract
        run: |
          package_name="$(node -p "require('./package.json').name")"
          head -c 4096 lib/client.js | grep -qF "id: \"${package_name}\"" || {
            echo "lib/client.js does not register under \"${package_name}\"."
            exit 1
          }
          head -c 4096 lib/client.js | grep -qF 'var module = { exports: {} };' || {
            echo 'lib/client.js is missing the CJS prologue (tsdown outputOptions.intro).'
            exit 1
          }

      - name: Use npm trusted publishing
        run: npm install --global npm@11

      - name: Publish package
        run: npm publish --provenance
